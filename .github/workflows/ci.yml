name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '26'
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests (core, api, web)
        run: pnpm test
      - name: Translations complete
        run: pnpm i18n:check
      - name: Build site
        run: pnpm --filter @airobots/web build
        env:
          SITE_URL: https://airobotstxtgenerator.com
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  e2e:
    name: Playwright and Lighthouse
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - name: Install Playwright browser
        run: pnpm --filter @airobots/web exec playwright install --with-deps chromium
      - name: Playwright
        run: pnpm --filter @airobots/web test:e2e
      - name: Lighthouse CI (mobile, ≥ 95 in every category)
        run: pnpm dlx @lhci/cli@0.16.0 autorun --config=apps/web/lighthouserc.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    name: Docker images → GHCR
    needs: e2e
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [web, api]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.app }}
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          build-args: |
            SITE_URL=${{ vars.SITE_URL || 'https://airobotstxtgenerator.com' }}
            ANALYTICS_PROVIDER=${{ vars.ANALYTICS_PROVIDER || 'none' }}
            PLAUSIBLE_DOMAIN=${{ vars.PLAUSIBLE_DOMAIN }}
            ADS_ENABLED=${{ vars.ADS_ENABLED || 'false' }}
            ADSENSE_CLIENT=${{ vars.ADSENSE_CLIENT }}
            GSC_VERIFICATION=${{ vars.GSC_VERIFICATION }}
            BING_VERIFICATION=${{ vars.BING_VERIFICATION }}
            INDEXNOW_KEY=${{ vars.INDEXNOW_KEY }}
            CONTACT_EMAIL=${{ vars.CONTACT_EMAIL }}
      - name: Image size
        run: |
          docker pull ghcr.io/${{ github.repository }}-${{ matrix.app }}:sha-${GITHUB_SHA::7}
          docker image ls ghcr.io/${{ github.repository }}-${{ matrix.app }}
